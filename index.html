<!doctype html>
<!-- ★ setLanguage() 가 부팅 때 이 값을 실제 언어로 덮어쓴다(src/i18n/index.ts). -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
        />
        <meta name="theme-color" content="#FBFBF9" />

        <!--
          3차 방어선. 1차는 markdown-it html:false, 2차는 DOMPurify (6-1절).
          - style-src 'unsafe-inline' : KaTeX 가 인라인 style 로 글자 위치를 잡는다. 스크립트 실행과 무관하다.
          - img-src 에 https: : 원격 이미지를 쓴 문서를 표시하기 위한 것.
            기본 설정은 '원격 이미지 불러오기 꺼짐'이고, 꺼져 있으면 렌더 단계에서 src 를 떼어낸다(6-4절).
          - font-src 에 data: : ★ Mermaid 가 base64 woff2 를 data: URI 로 심어 넣는다.
            'self' 만 두면 실기기에서 폰트가 차단되어 다이어그램 글자가 폴백 폰트로 그려진다
            (2026-08-03 Galaxy S22 Ultra 실측 — 아래 로그).
              Loading the font 'data:font/woff2;base64,...' violates the following
              Content Security Policy directive: "font-src 'self'". The action has been blocked.
          - frame-ancestors 를 뺐다. ★ <meta> 로 전달하면 브라우저가 무시하고 경고만 낸다
            (실측: "directive 'frame-ancestors' is ignored when delivered via a <meta> element").
            HTTP 헤더로만 동작하는데 Capacitor 는 헤더를 못 준다. 죽은 설정이라 지웠다.
            액티비티가 프레임에 들어갈 경로 자체가 없다(BROWSABLE 미선언).
        -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self';
                     script-src 'self';
                     style-src 'self' 'unsafe-inline';
                     img-src 'self' data: https:;
                     font-src 'self' data:;
                     connect-src 'self';
                     object-src 'none';
                     base-uri 'none';
                     form-action 'none'"
        />

        <title>Marklet</title>
    </head>
    <body>
        <div id="app">
            <!-- 부팅 전 잠깐 보이는 화면. 스플래시가 내려간 뒤 첫 프레임을 덮는다. -->
            <div id="boot" class="boot-screen" aria-hidden="true"></div>
        </div>
        <div id="overlay-root"></div>
        <div id="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
